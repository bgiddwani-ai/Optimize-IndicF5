name: Validate portable configuration
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - run: bash -n run.sh
      - run: ./run.sh render > /tmp/benchmark.yaml
      - run: ./run.sh render --serve > /tmp/serve.yaml
      - run: git diff --check
